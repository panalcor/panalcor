<style>
:root{
  --navy-deep:#0d1b2a;--navy-mid:#1a2d42;--navy-light:#243d56;--navy-dark:#0d1b2a;
  --gold:#c9a227;--gold-light:#f0c040;--white:#f0f4f8;
  --red:#e74c3c;--green:#2ecc71;--yellow:#f39c12;--blue:#3498db;
  --purple:#9b59b6;--radius:10px;
}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--navy-deep);color:var(--white);font-family:'Barlow',sans-serif;font-size:1rem;min-height:100vh}

/* ── LOGIN ── */
.login-screen{position:fixed;inset:0;background:var(--navy-deep);display:flex;align-items:center;justify-content:center;z-index:999;flex-direction:column;gap:20px}
.login-box{background:var(--navy-mid);border:1px solid rgba(201,162,39,0.3);border-radius:16px;padding:40px;width:340px;text-align:center}
.login-box h2{font-size:1.5rem;font-weight:900;color:var(--gold-light);letter-spacing:0.08em;margin-bottom:6px}
.login-box .sub{font-size:0.78rem;color:rgba(255,255,255,0.4);letter-spacing:0.12em;text-transform:uppercase;margin-bottom:28px}
.login-box input{width:100%;background:var(--navy-deep);color:var(--white);border:1px solid rgba(255,255,255,0.2);border-radius:8px;padding:13px 16px;font-family:'Barlow',sans-serif;font-size:1.1rem;text-align:center;letter-spacing:0.2em;margin-bottom:14px}
.login-box input:focus{outline:none;border-color:var(--gold)}
.login-btn{width:100%;padding:13px;background:linear-gradient(135deg,var(--gold),#a07d1a);color:#0d1b2a;border:none;border-radius:8px;font-family:'Barlow',sans-serif;font-size:1rem;font-weight:900;letter-spacing:0.1em;cursor:pointer;transition:all .2s}
.login-btn:hover{background:linear-gradient(135deg,var(--gold-light),var(--gold))}
.login-err{color:var(--red);font-size:0.85rem;margin-top:8px;display:none}

/* ── TOPBAR ── */
.topbar{background:linear-gradient(135deg,#0a1520,var(--navy-mid));border-bottom:2px solid var(--gold);padding:14px 20px;display:flex;align-items:center;gap:14px}
.topbar h1{font-size:1.4rem;font-weight:900;letter-spacing:0.06em;color:var(--gold-light)}
.topbar .sub{font-size:0.78rem;color:rgba(255,255,255,0.5);letter-spacing:0.1em}
.back-btn,.logout-btn{background:rgba(201,162,39,0.15);border:1px solid rgba(201,162,39,0.4);color:var(--gold);padding:8px 14px;border-radius:7px;cursor:pointer;font-family:'Barlow',sans-serif;font-size:0.85rem;letter-spacing:0.06em;transition:all .2s;text-decoration:none;display:inline-block}
.back-btn:hover,.logout-btn:hover{background:rgba(201,162,39,0.3)}
.logout-btn{margin-left:auto;color:rgba(255,255,255,0.5);border-color:rgba(255,255,255,0.2)}

/* ── LAYOUT ── */
.container{max-width:900px;margin:0 auto;padding:20px 16px}

/* ── CARD / FIELD ── */
.card{background:var(--navy-mid);border:1px solid rgba(255,255,255,0.1);border-radius:var(--radius);padding:18px;margin-bottom:16px}
.field{margin-bottom:16px}
.field label{display:block;font-size:0.78rem;letter-spacing:0.12em;text-transform:uppercase;color:var(--gold);margin-bottom:6px}
.field input,.field select{width:100%;background:var(--navy-deep);color:var(--white);border:1px solid rgba(255,255,255,0.2);border-radius:7px;padding:11px 14px;font-family:'Barlow',sans-serif;font-size:1rem}
.field input:focus,.field select:focus{outline:none;border-color:var(--gold)}

/* ── DATA TABLE ── */
.data-table{width:100%;border-collapse:collapse;font-size:0.9rem}
.data-table th{text-align:left;padding:9px 14px;font-size:0.7rem;letter-spacing:0.1em;text-transform:uppercase;color:var(--gold);border-bottom:1px solid rgba(201,162,39,0.2);white-space:nowrap}
.data-table td{padding:10px 14px;border-bottom:1px solid rgba(255,255,255,0.05)}
.data-table tr:hover td{background:rgba(255,255,255,0.03)}

/* ── TOAST ── */
.toast{position:fixed;bottom:24px;right:24px;background:var(--navy-mid);border:1px solid rgba(201,162,39,0.5);border-radius:10px;padding:14px 22px;font-size:0.95rem;font-weight:600;z-index:9999;opacity:0;transform:translateY(20px);transition:all .3s;pointer-events:none;max-width:340px}
.toast.show{opacity:1;transform:translateY(0)}
</style>
</head>

<!-- ══ LOGIN ══ -->

    <div class="field" style="margin-bottom:12px">
      <label>📝 Descripción / Título (opcional)</label>

  </div>

</div>
</div><!-- /app -->

function getPwd(){ return localStorage.getItem(PW_KEY) || 'admin'; }

  {n:'IVAN', pwd:'ivan2026'},
];
function _checkLogin(val){
  if(val === getPwd()) return true;
  return ADMINS_EXTRA.some(function(a){ return a.pwd === val; });
}
function login(){
  try {
    const val = document.getElementById('pwInput').value;
    if(_checkLogin(val)){
      localStorage.setItem('adminSession', Date.now());
      document.getElementById('loginScreen').style.display = 'none';
      document.getElementById('app').style.display = 'block';
      try { initApp(); } catch(e2) { console.error('initApp error:', e2); }
    } else {
      document.getElementById('loginErr').style.display = 'block';
      document.getElementById('pwInput').value = '';
      document.getElementById('pwInput').focus();
    }
  } catch(e) {
    alert('Error en login: ' + e.message);
  }
}
function logout(){
  localStorage.removeItem('adminSession');
  location.reload();
}
document.addEventListener('DOMContentLoaded', function(){
  var pw = document.getElementById('pwInput');

// ══════════════════════════════════════════════════
// REPUESTOS — solo lo mínimo para el buscador de componentes
// ══════════════════════════════════════════════════
var _repBase  = [];
var _repExtra = {};
function _cargarRepuestosMinimo(){
  try {
    var cached = JSON.parse(localStorage.getItem('repuestosCache') || 'null');
    if (Array.isArray(cached)) _repBase = cached;
  } catch(e){}
  DB.ref('repuestos_catalogo').once('value').then(function(snap){
    _repExtra = snap.val() || {};
  });
}

// ══════════════════════════════════════════════════
// INIT
// ══════════════════════════════════════════════════
function initApp(){
  loadMaquinasExtra(function(){ poblarSelectorIntMaq(); });
  _cargarRepuestosMinimo();
  DB.ref('config/mecanicos').once('value').then(function(snap){
    _intMecsList = snap.val() || [];
    _poblarChecksMecs();
  });
  initIntegrales();
}

// ══════════════════════════════════════════════════════════════
// INTEGRALES — mantenimientos anuales programados
// ══════════════════════════════════════════════════════════════
var _intData        = {};   // cache local {id -> integral}
var _intListenerOn  = false;
var _intActualId    = null; // integral abierta en modal
var _intRepSearch   = [];   // resultados buscador repuestos en modal

var INT_ESTADOS = {
  programada: { label: 'Programada', color: '#f39c12', bg: 'rgba(243,156,18,0.15)', icon: '🟡' },
  en_curso:   { label: 'En curso',   color: '#3498db', bg: 'rgba(52,152,219,0.15)', icon: '🔵' },
  completada: { label: 'Completada', color: '#27ae60', bg: 'rgba(39,174,96,0.15)',  icon: '🟢' },
  cancelada:  { label: 'Cancelada',  color: '#7f8c8d', bg: 'rgba(127,140,141,0.1)', icon: '⚫' }
};

var CK_ESTADOS = {
  pendiente: { label: 'PENDIENTE', color: '#f39c12', bg: 'rgba(243,156,18,0.18)', icon: '⏳' },
  ok:        { label: 'OK',        color: '#27ae60', bg: 'rgba(39,174,96,0.2)',   icon: '✅' },
  np:        { label: 'N/P',       color: '#7f8c8d', bg: 'rgba(127,140,141,0.2)', icon: '⚫' },
  mal:       { label: 'MAL',       color: '#e74c3c', bg: 'rgba(231,76,60,0.2)',   icon: '❌' },
  reparado:  { label: 'REPARADO',  color: '#3498db', bg: 'rgba(52,152,219,0.2)',  icon: '🔧' },
  revisar:   { label: 'REVISAR',   color: '#f1c40f', bg: 'rgba(241,196,15,0.18)', icon: '⚠️' }
};

var _intMecsList = [];  // lista de mecánicos cargada de Firebase

function initIntegrales() {
  poblarSelectorIntMaq();
  if (_intListenerOn) { renderIntegrales(); return; }
  _intListenerOn = true;
  DB.ref('integrales').on('value', function(snap) {
    _intData = snap.val() || {};
    renderIntegrales();
    if (_intActualId && _intData[_intActualId]) renderIntModal(_intActualId);
  });
}

function _poblarChecksMecs() {
  var wrap = document.getElementById('intMecsWrap');
  if (!wrap) return;
  if (!_intMecsList.length) { wrap.innerHTML = '<span style="color:rgba(255,255,255,0.3);font-size:0.82rem">Sin mecánicos configurados</span>'; return; }
  wrap.innerHTML = _intMecsList.map(function(m) {
    return '<label style="display:flex;align-items:center;gap:6px;cursor:pointer;background:rgba(255,255,255,0.05);'
         + 'border:1px solid rgba(255,255,255,0.12);border-radius:6px;padding:5px 10px;font-size:0.82rem">'
         + '<input type="checkbox" class="int-mec-check" value="'+m+'" style="accent-color:var(--gold)"> '+m+'</label>';
  }).join('');
}

function _getMecsSeleccionados() {
  return Array.from(document.querySelectorAll('.int-mec-check:checked')).map(function(c){ return c.value; });
}

function poblarSelectorIntMaq() {
  var sel = document.getElementById('intMaq');
  if (!sel || sel.options.length > 1) return;
  var todas = MAQUINAS_BASE_ADMIN.concat(maquinasExtra).sort(function(a,b){ return a.n.localeCompare(b.n); });
  todas.forEach(function(m) {
    var o = document.createElement('option');
    o.value = m.id; o.textContent = m.n;
    sel.appendChild(o);
  });
}

function mostrarFormInt() {
  document.getElementById('formIntWrap').style.display = 'block';
  document.getElementById('btnNuevaInt').style.display = 'none';
  var hoy = new Date();
  document.getElementById('intMes').value = hoy.getFullYear()+'-'+String(hoy.getMonth()+2).padStart(2,'0');
  poblarSelectorIntMaq();
}
function ocultarFormInt() {
  document.getElementById('formIntWrap').style.display = 'none';
  document.getElementById('btnNuevaInt').style.display = '';
  document.getElementById('intMaq').value = '';
  document.getElementById('intMes').value = '';
  document.getElementById('intDesc').value = '';
}

function crearIntegral() {
  var maqId  = document.getElementById('intMaq').value;
  var mes    = document.getElementById('intMes').value;
  var desc   = (document.getElementById('intDesc').value || '').trim();
  var sel    = document.getElementById('intMaq');
  var maqNom = maqId ? sel.options[sel.selectedIndex].text : '';
  var mecs   = _getMecsSeleccionados();
  if (!maqId || !mes) { showToast('⚠️ Selecciona máquina y mes'); return; }
  var id  = 'INT-' + Date.now();
  // Inicializar confirmaciones vacías para cada mecánico
  var confirmaciones = {};
  mecs.forEach(function(m) { confirmaciones[m.replace(/\s/g,'_')] = { nombre: m, confirmado: false }; });
  var obj = {
    id: id, maqId: maqId, maqNombre: maqNom,
    mesPrevisto: mes, estado: 'programada',
    descripcion: desc, componentes: {}, checklist: {},
    mecanicos: mecs, confirmaciones: confirmaciones,
    observaciones: '', createdAt: new Date().toISOString().substring(0,10), fechaCierre: ''
  };
  DB.ref('integrales/' + id).set(obj).then(function() {
    ocultarFormInt();
    showToast('✅ Integral creada');
    abrirIntModal(id);
  }).catch(function() { showToast('❌ Error al crear'); });
}

// ── Render lista ─────────────────────────────────────────────
function renderIntegrales() {
  var wrap = document.getElementById('intListWrap');
  var lista = Object.values(_intData).sort(function(a,b){ return (a.mesPrevisto||'').localeCompare(b.mesPrevisto||''); });
  if (!lista.length) {
    wrap.innerHTML = '<div style="text-align:center;color:rgba(255,255,255,0.3);padding:50px 0;font-size:0.85rem">📭 No hay integrales programadas.<br>Pulsa "Nueva Integral" para crear una.</div>';
    return;
  }
  // Agrupar por estado
  var grupos = { programada:[], en_curso:[], completada:[], cancelada:[] };
  lista.forEach(function(i){ (grupos[i.estado] || grupos.programada).push(i); });
  var html = '';
  ['en_curso','programada','completada','cancelada'].forEach(function(est) {
    var items = grupos[est];
    if (!items.length) return;
    var cfg = INT_ESTADOS[est];
    html += '<div style="margin-bottom:24px">';
    html += '<div style="font-size:0.7rem;font-weight:700;letter-spacing:0.12em;color:'+cfg.color+';text-transform:uppercase;margin-bottom:10px;padding-left:2px">'
          + cfg.icon + ' ' + cfg.label + ' (' + items.length + ')</div>';
    html += '<div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:12px">';
    items.forEach(function(it) {
      var nComp = Object.keys(it.componentes || {}).length;
      var mesLabel = it.mesPrevisto ? _intMesLabel(it.mesPrevisto) : '—';
      html += '<div onclick="abrirIntModal(\''+it.id+'\')" style="cursor:pointer;background:var(--navy-dark);'
            + 'border:1px solid '+cfg.color+'40;border-radius:12px;padding:16px;transition:border-color .2s;'
            + 'border-left:4px solid '+cfg.color+'">'
            + '<div style="display:flex;align-items:flex-start;justify-content:space-between;gap:8px;margin-bottom:8px">'
            + '<div style="font-weight:700;font-size:0.95rem;color:#fff;line-height:1.3">'
            + escHtml(it.maqNombre) + '</div>'
            + '<span style="font-size:0.68rem;font-weight:700;letter-spacing:0.08em;padding:3px 8px;border-radius:5px;'
            + 'background:'+cfg.bg+';color:'+cfg.color+';white-space:nowrap">' + cfg.label + '</span>'
            + '</div>'
            + (it.descripcion ? '<div style="font-size:0.78rem;color:rgba(255,255,255,0.5);margin-bottom:6px">'
              + escHtml(it.descripcion) + '</div>' : '')
            + '<div style="display:flex;gap:12px;font-size:0.75rem;color:rgba(255,255,255,0.45)">'
            + '<span>📅 ' + mesLabel + '</span>'
            + '<span>🔩 ' + nComp + ' componente' + (nComp!==1?'s':'') + '</span>'
            + '</div>'
            + '</div>';
    });
    html += '</div></div>';
  });
  wrap.innerHTML = html;
}

function _intMesLabel(ym) {
  var meses = ['Enero','Febrero','Marzo','Abril','Mayo','Junio','Julio','Agosto','Septiembre','Octubre','Noviembre','Diciembre'];
  var p = ym.split('-');
  return meses[parseInt(p[1]||1)-1] + ' ' + p[0];
}

// ── Modal detalle ─────────────────────────────────────────────
function abrirIntModal(id) {
  _intActualId = id;
  var it = _intData[id];
  if (!it) return;
  renderIntModal(id);
  document.getElementById('intModal').style.display = 'block';
  document.body.style.overflow = 'hidden';
}
function cerrarIntModal() {
  document.getElementById('intModal').style.display = 'none';
  document.body.style.overflow = '';
  _intActualId = null;
  _intRepSearch = [];
}

function toggleEditInt(show) {
  var el = document.getElementById('intEditForm');
  if (!el) return;
  var mostrar = (show === undefined) ? (el.style.display === 'none') : !!show;
  el.style.display = mostrar ? 'block' : 'none';
}

function guardarEditInt(id) {
  var sel = document.getElementById('intEditMaq');
  var maqId = sel.value;
  var maqNombre = sel.options[sel.selectedIndex] ? sel.options[sel.selectedIndex].text : '';
  var mesPrevisto = document.getElementById('intEditMes').value;
  var descripcion = (document.getElementById('intEditDesc').value || '').trim();
  if (!maqId || !mesPrevisto) { showToast('⚠️ Selecciona máquina y mes'); return; }
  DB.ref('integrales/' + id).update({ maqId: maqId, maqNombre: maqNombre, mesPrevisto: mesPrevisto, descripcion: descripcion })
    .then(function() {
      showToast('✅ Datos actualizados');
      toggleEditInt(false);
    })
    .catch(function() { showToast('❌ Error al guardar'); });
}

function renderIntModal(id) {
  var it = _intData[id];
  if (!it) return;
  var cfg = INT_ESTADOS[it.estado] || INT_ESTADOS.programada;
  document.getElementById('intModalTitle').textContent = cfg.icon + ' ' + it.maqNombre;
  document.getElementById('intModalSub').textContent = _intMesLabel(it.mesPrevisto||'') + (it.descripcion ? ' · ' + it.descripcion : '');

  var comps = Object.values(it.componentes || {}).sort(function(a,b){ return (a.orden||0)-(b.orden||0); });
  var totalQty = comps.reduce(function(s,c){ return s+(c.qty||1); }, 0);

  var html = '';

  // ── Editar datos básicos (máquina, mes previsto, descripción) ──
  // Oculto por defecto; se muestra con el botón ✏️ de la cabecera del modal.
  var todasMaqs = MAQUINAS_BASE_ADMIN.concat(maquinasExtra).sort(function(a,b){ return a.n.localeCompare(b.n); });
  var maqOpts = todasMaqs.map(function(m){
    return '<option value="'+m.id+'" '+(m.id===it.maqId?'selected':'')+'>'+escHtml(m.n)+'</option>';
  }).join('');
  html += '<div id="intEditForm" style="display:none;background:rgba(52,152,219,0.08);border:1px solid rgba(52,152,219,0.3);border-radius:10px;padding:14px;margin-bottom:18px">'
    + '<div style="display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:10px">'
    + '<div class="field" style="margin:0"><label>🏭 Máquina</label><select id="intEditMaq" style="width:100%">'+maqOpts+'</select></div>'
    + '<div class="field" style="margin:0"><label>📅 Mes previsto</label><input type="month" id="intEditMes" value="'+escHtml(it.mesPrevisto||'')+'" style="width:100%;background:var(--navy-dark);color:#fff;border:1px solid rgba(255,255,255,0.15);border-radius:8px;padding:9px 12px;font-family:Barlow,sans-serif;font-size:0.9rem"></div>'
    + '</div>'
    + '<div class="field" style="margin-bottom:12px"><label>📝 Descripción / Título</label><input type="text" id="intEditDesc" value="'+escHtml(it.descripcion||'')+'" style="width:100%"></div>'
    + '<div style="display:flex;gap:8px">'
    + '<button onclick="guardarEditInt(\''+id+'\')" style="background:var(--green);color:#fff;border:none;border-radius:7px;padding:8px 18px;cursor:pointer;font-weight:700;font-size:0.85rem">💾 Guardar cambios</button>'
    + '<button onclick="toggleEditInt(false)" style="background:rgba(255,255,255,0.08);color:rgba(255,255,255,0.6);border:1px solid rgba(255,255,255,0.15);border-radius:7px;padding:8px 16px;cursor:pointer;font-size:0.85rem">Cancelar</button>'
    + '</div></div>';

  // ── Barra de estado ──
  html += '<div style="display:flex;gap:8px;flex-wrap:wrap;margin-bottom:18px">';
  ['programada','en_curso','completada','cancelada'].forEach(function(est) {
    var c = INT_ESTADOS[est];
    var activo = it.estado === est;
    html += '<button onclick="cambiarEstadoInt(\''+id+'\',\''+est+'\')" '
          + 'style="border:1px solid '+c.color+(activo?';background:'+c.bg+';font-weight:700':';background:rgba(255,255,255,0.04)')+';'
          + 'color:'+(activo?c.color:'rgba(255,255,255,0.45)')+';border-radius:7px;padding:6px 14px;cursor:pointer;font-size:0.78rem;font-family:Barlow,sans-serif">'
          + c.icon + ' ' + c.label + '</button>';
  });
  html += '</div>';

  // ── Mecánicos asignados ──
  var mecs = it.mecanicos || [];
  var confs = it.confirmaciones || {};
  html += '<div style="background:rgba(255,255,255,0.03);border:1px solid rgba(255,255,255,0.1);border-radius:10px;padding:13px;margin-bottom:18px">';
  html += '<div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:10px">'
        + '<div style="font-size:0.8rem;font-weight:700;color:rgba(255,255,255,0.6);letter-spacing:0.05em">👷 MECÁNICOS ASIGNADOS</div>'
        + '</div>';
  // Checkboxes para añadir/quitar mecánicos
  html += '<div style="display:flex;flex-wrap:wrap;gap:6px;margin-bottom:10px">';
  _intMecsList.forEach(function(m) {
    var asignado = mecs.indexOf(m) !== -1;
    var conf = confs[m.replace(/\s/g,'_')];
    var confirmado = conf && conf.confirmado;
    html += '<label style="display:flex;align-items:center;gap:6px;cursor:pointer;background:'
          + (asignado ? (confirmado ? 'rgba(39,174,96,0.2)' : 'rgba(52,152,219,0.15)') : 'rgba(255,255,255,0.04)')
          + ';border:1px solid '+(asignado ? (confirmado ? '#27ae60' : '#3498db') : 'rgba(255,255,255,0.12)')
          + ';border-radius:6px;padding:5px 10px;font-size:0.82rem;transition:all .2s">'
          + '<input type="checkbox" onchange="intToggleMec(\''+id+'\',\''+m+'\')" '+(asignado?'checked':'')
          + ' style="accent-color:var(--gold)"> '
          + m + (confirmado ? ' ✅' : (asignado ? ' ⏳' : ''))
          + '</label>';
  });
  html += '</div>';
  if (!mecs.length) html += '<div style="font-size:0.78rem;color:rgba(255,255,255,0.3)">Sin mecánicos asignados — marca los que participarán</div>';
  html += '</div>';

  // ── Checklist de revisión ──
  var ckItems = Object.values(it.checklist || {}).sort(function(a,b){ return (a.orden||0)-(b.orden||0); });
  var ckTotal  = ckItems.length;
  var ckResueltos = ckItems.filter(function(c){ return c.estado && c.estado !== 'pendiente'; }).length;
  var ckPct = ckTotal > 0 ? Math.round(ckResueltos/ckTotal*100) : 0;
  var ckBarColor = ckPct === 100 ? '#27ae60' : ckPct > 50 ? '#3498db' : '#f39c12';

  html += '<div style="background:rgba(255,255,255,0.03);border:1px solid rgba(255,255,255,0.1);border-radius:10px;padding:14px;margin-bottom:18px">';
  html += '<div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:10px">'
        + '<div style="font-size:0.8rem;font-weight:700;color:rgba(255,255,255,0.6);letter-spacing:0.05em">✅ CHECKLIST DE REVISIÓN</div>'
        + (ckTotal > 0 ? '<div style="font-size:0.72rem;color:rgba(255,255,255,0.35)">'+ckResueltos+' / '+ckTotal+' revisados</div>' : '')
        + '</div>';

  // Barra de progreso
  if (ckTotal > 0) {
    html += '<div style="background:rgba(255,255,255,0.08);border-radius:20px;height:6px;margin-bottom:14px;overflow:hidden">'
          + '<div style="height:100%;width:'+ckPct+'%;background:'+ckBarColor+';border-radius:20px;transition:width .4s"></div>'
          + '</div>';
  }

  // Items checklist
  if (ckItems.length) {
    ckItems.forEach(function(ck, idx) {
      var isFirst = idx === 0;
      var isLast  = idx === ckItems.length - 1;
      html += '<div style="background:rgba(255,255,255,0.03);border:1px solid rgba(255,255,255,0.07);border-radius:8px;padding:10px 12px;margin-bottom:8px">';
      // Fila principal: orden + descripción editable + acciones
      html += '<div style="display:flex;align-items:center;gap:8px">';
      // Botones orden
      html += '<div style="display:flex;flex-direction:column;gap:2px;flex-shrink:0">'
            + '<button onclick="ckMoverArriba(\''+id+'\','+idx+')" '
            + 'style="background:rgba(255,255,255,0.06);border:1px solid rgba(255,255,255,0.12);color:'+(isFirst?'rgba(255,255,255,0.15)':'rgba(255,255,255,0.55)')+';border-radius:4px;width:22px;height:22px;cursor:'+(isFirst?'default':'pointer')+';font-size:0.7rem;line-height:1;padding:0" '
            + (isFirst?'disabled':'')+'title="Subir">▲</button>'
            + '<button onclick="ckMoverAbajo(\''+id+'\','+idx+')" '
            + 'style="background:rgba(255,255,255,0.06);border:1px solid rgba(255,255,255,0.12);color:'+(isLast?'rgba(255,255,255,0.15)':'rgba(255,255,255,0.55)')+';border-radius:4px;width:22px;height:22px;cursor:'+(isLast?'default':'pointer')+';font-size:0.7rem;line-height:1;padding:0" '
            + (isLast?'disabled':'')+'title="Bajar">▼</button>'
            + '</div>';
      // Número de orden
      html += '<span style="font-size:0.7rem;color:rgba(255,255,255,0.25);min-width:18px;text-align:center;flex-shrink:0">'+(idx+1)+'</span>';
      // Descripción editable
      html += '<input type="text" value="'+escHtml(ck.desc)+'" '
            + 'onblur="ckEditarDesc(\''+id+'\',\''+ck._key+'\',this.value)" '
            + 'style="flex:1;background:transparent;border:none;border-bottom:1px solid rgba(255,255,255,0.1);color:#fff;'
            + 'font-size:0.85rem;font-weight:600;font-family:Barlow,sans-serif;padding:2px 4px;outline:none" '
            + 'onfocus="this.style.borderBottomColor=\'var(--gold)\'" onblur="this.style.borderBottomColor=\'rgba(255,255,255,0.1)\';ckEditarDesc(\''+id+'\',\''+ck._key+'\',this.value)">';
      // Botón eliminar
      html += '<button onclick="ckEliminar(\''+id+'\',\''+ck._key+'\')" '
            + 'style="background:rgba(192,57,43,0.15);border:1px solid rgba(192,57,43,0.3);color:#e74c3c;border-radius:5px;width:24px;height:24px;cursor:pointer;font-size:0.8rem;flex-shrink:0" title="Eliminar">✕</button>';
      html += '</div>';
      // Botones estado + nota
      html += '<div style="display:flex;gap:4px;flex-wrap:wrap;margin-top:8px;padding-left:50px">';
      Object.keys(CK_ESTADOS).forEach(function(est) {
        var c = CK_ESTADOS[est];
        var activo = (ck.estado||'pendiente') === est;
        html += '<button onclick="ckCambiarEstado(\''+id+'\',\''+ck._key+'\',\''+est+'\')" '
              + 'style="border:1px solid '+(activo?c.color:'rgba(255,255,255,0.15)')+';background:'+(activo?c.bg:'transparent')+';'
              + 'color:'+(activo?c.color:'rgba(255,255,255,0.3)')+';border-radius:5px;padding:3px 8px;cursor:pointer;font-size:0.72rem;font-weight:700;font-family:Barlow,sans-serif;white-space:nowrap">'

// ── Asignación de mecánicos ───────────────────────────────────
function intToggleMec(intId, nombre) {
  var it   = _intData[intId];
  if (!it) return;
  var mecs = (it.mecanicos || []).slice();
  var confs = JSON.parse(JSON.stringify(it.confirmaciones || {}));
  var key  = nombre.replace(/\s/g,'_');
  var idx  = mecs.indexOf(nombre);
  if (idx === -1) {
    mecs.push(nombre);
    confs[key] = { nombre: nombre, confirmado: false };
  } else {
    mecs.splice(idx, 1);
    delete confs[key];
  }
  DB.ref('integrales/'+intId).update({ mecanicos: mecs, confirmaciones: confs })
    .then(function(){
      // Notificar al mecánico si se acaba de añadir
      if (idx === -1) {
        fcmEnviar(nombre,
          '🔩 Integral asignado',
          'Se te ha asignado el mantenimiento integral de ' + (it.maqNombre || '') + ' — ' + (_intMesLabel(it.mesPrevisto||'')),
          'mis_tareas.html', '🔩');
      }
    })
    .catch(function(){ showToast('❌ Error'); });
}

// ── Checklist CRUD ────────────────────────────────────────────
function ckMoverArriba(intId, idx) {
  _ckIntercambiar(intId, idx, idx - 1);
}
function ckMoverAbajo(intId, idx) {
  _ckIntercambiar(intId, idx, idx + 1);
}
function _ckIntercambiar(intId, idxA, idxB) {
  var it = _intData[intId];
  if (!it) return;
  var items = Object.values(it.checklist || {}).sort(function(a,b){ return (a.orden||0)-(b.orden||0); });
  if (idxB < 0 || idxB >= items.length) return;
  var updates = {};
  updates['checklist/'+items[idxA]._key+'/orden'] = idxB;
  updates['checklist/'+items[idxB]._key+'/orden'] = idxA;
  DB.ref('integrales/'+intId).update(updates).catch(function(){ showToast('❌ Error al reordenar'); });
}
function ckEditarDesc(intId, ckKey, desc) {
  desc = desc.trim();
  if (!desc) return;
  DB.ref('integrales/'+intId+'/checklist/'+ckKey+'/desc').set(desc)
    .catch(function(){ showToast('❌ Error al guardar'); });
}

function ckAñadir(intId) {
  var inp  = document.getElementById('ckNuevoDesc');
  var desc = (inp ? inp.value : '').trim();
  if (!desc) { showToast('⚠️ Escribe un punto de revisión'); return; }
  var key  = 'ck_' + Date.now();
  var nComp = Object.keys((_intData[intId]||{}).checklist||{}).length;
  var obj  = { _key: key, desc: desc, estado: 'pendiente', notas: '', orden: nComp };
  DB.ref('integrales/'+intId+'/checklist/'+key).set(obj)
    .then(function(){ showToast('✅ Punto añadido'); })
    .catch(function(){ showToast('❌ Error al añadir'); });
}

function ckCambiarEstado(intId, ckKey, estado) {

}

function ckGuardarNota(intId, ckKey, nota) {

function ckEliminar(intId, ckKey) {

// ── Buscador de repuestos en modal ────────────────────────────
var _intRepSeleccionado = null;

function buscarRepIntModal() {
  var q = (document.getElementById('intRepBuscar').value || '').trim().toLowerCase();
  var drop = document.getElementById('intRepDrop');
  if (q.length < 2) { drop.style.display = 'none'; _intRepSeleccionado = null; return; }

  // Fusionar base + enriquecimientos
  var mapa = {};
  _repBase.forEach(function(r) {
    var k = (r.ref||r.desc||'').replace(/\s+/g,'_').toUpperCase();
    if (k) mapa[k] = { desc: r.desc||'', ref: String(r.ref||'') };
  });
  Object.values(_repExtra).forEach(function(r) {
    var k = (r.ref||r.desc||'').replace(/\s+/g,'_').toUpperCase();
    if (k) mapa[k] = Object.assign(mapa[k]||{}, { desc: r.desc||mapa[k]&&mapa[k].desc||'', ref: String(r.ref||'') });
  });

  var words = q.split(/\s+/);
  _intRepSearch = Object.values(mapa).filter(function(r) {
    var h = (r.desc + ' ' + r.ref).toLowerCase();
    return words.every(function(w){ return h.includes(w); });
  }).slice(0, 10);

  if (!_intRepSearch.length) {
    drop.innerHTML = '<div style="padding:10px 12px;color:rgba(255,255,255,0.3);font-size:0.82rem">Sin resultados</div>';
    drop.style.display = 'block'; return;
  }
  drop.innerHTML = _intRepSearch.map(function(r, i) {
    return '<div data-iidx="'+i+'" style="padding:9px 12px;cursor:pointer;border-bottom:1px solid rgba(255,255,255,0.06);font-size:0.82rem">'
         + '<div style="color:#fff;font-weight:500">' + escHtml(r.desc) + '</div>'
         + '<div style="color:rgba(255,255,255,0.4);font-size:0.75rem">' + escHtml(r.ref||'sin ref') + '</div>'
         + '</div>';
  }).join('');
  drop.style.display = 'block';
}

// Click en dropdown repuestos del modal
document.addEventListener('click', function(e) {
  var item = e.target.closest('[data-iidx]');
  if (item && item.closest('#intRepDrop')) {
    var idx = parseInt(item.dataset.iidx);
    var r = _intRepSearch[idx];
    if (!r) return;
    _intRepSeleccionado = r;
    document.getElementById('intRepBuscar').value = r.desc + (r.ref ? ' ('+r.ref+')' : '');
    document.getElementById('intRepDrop').style.display = 'none';
    document.getElementById('intRepSelInfo').innerHTML
      = '<span style="color:var(--green)">✓ Seleccionado: <b>' + escHtml(r.desc) + '</b></span>'
      + ' — <button onclick="agregarCompIntegral(\''+_intActualId+'\')" '
      + 'style="background:var(--green);border:none;color:#fff;border-radius:6px;padding:4px 14px;cursor:pointer;font-size:0.78rem;font-weight:700;font-family:Barlow,sans-serif">➕ Añadir a la lista</button>';
    return;
  }
  if (!e.target.closest('#intRepDrop') && !e.target.closest('#intRepBuscar')) {
    var d = document.getElementById('intRepDrop');
    if (d) d.style.display = 'none';
  }
});

function agregarCompIntegral(id) {
  if (!_intRepSeleccionado) { showToast('⚠️ Selecciona un repuesto primero'); return; }
  var qty   = parseInt(document.getElementById('intRepQty').value || '1') || 1;
  var tipo  = document.getElementById('intRepTipo').value || 'obligatorio';
  var r     = _intRepSeleccionado;
  var ckey  = 'C-' + Date.now();
  var comp  = { _ckey: ckey, desc: r.desc, ref: r.ref||'', qty: qty, tipo: tipo, orden: Date.now() };
  DB.ref('integrales/'+id+'/componentes/'+ckey).set(comp).then(function() {
    _intRepSeleccionado = null;
    document.getElementById('intRepBuscar').value = '';
    document.getElementById('intRepSelInfo').textContent = 'Busca un repuesto para añadirlo a la lista';
    document.getElementById('intRepQty').value = '1';
    document.getElementById('intRepTipo').value = 'obligatorio';

}

    + '<div style="text-align:right;font-size:12px;color:#555">'
    + '<div><b>Mes previsto:</b> ' + mesLabel + '</div>'
    + '<div><b>Fecha impresión:</b> ' + new Date().toLocaleDateString('es-ES') + '</div>'
    + '<div><b>Técnico:</b> ___________________</div></div>'
    + '</div>'
    + (ckItems.length ? '<h2 style="font-size:13px;font-weight:700;color:#000;margin-bottom:8px">✅ Checklist de revisión</h2>'
      + '<table><thead><tr>'
      + '<th style="width:32px">#</th>'
      + '<th>Tarea</th>'
      + '<th style="width:100px">Estado</th>'
      + '<th>Observaciones</th>'
      + '</tr></thead><tbody>' + filasCk + '</tbody></table>' : '')
    + (comps.length ? '<h2 style="font-size:13px;font-weight:700;color:#000;margin-bottom:8px">🔧 Componentes / repuestos</h2>'
      + '<table><thead><tr>'
      + '<th style="width:32px">#</th>'
      + '<th>Componente / Repuesto</th>'
      + '<th style="width:90px;text-align:center">Referencia</th>'
      + '<th style="width:55px;text-align:center">Cant.</th>'
      + '<th style="width:90px">Estado</th>'
      + '<th>Observaciones</th>'
      + '</tr></thead><tbody>' + filas + '</tbody></table>' : '')
    + (it.observaciones ? '<div style="border:1px solid #ddd;border-radius:6px;padding:10px;margin-bottom:20px;font-size:12px"><b>Observaciones:</b> ' + escHtml(it.observaciones) + '</div>' : '')
    + '<div class="firma-row">'
    + '<div class="firma-box">Firma técnico</div>'
    + '<div class="firma-box">Fecha realización</div>'
    + '<div class="firma-box">Visto bueno encargado</div>'
    + '</div>'
    + '<div style="text-align:center;margin-top:12px"><button onclick="window.print()" style="padding:8px 24px;font-size:13px;cursor:pointer">🖨️ Imprimir</button></div>'
    + '</body></html>');
  win.document.close();
}

// Crea una nueva integral para una fecha futura, copiando el checklist y
// los componentes de la actual (misma plantilla) pero reseteados: checklist
// vuelve a "pendiente" sin notas, confirmaciones de mecánicos sin marcar,
// observaciones en blanco. No modifica la integral original.
function repetirIntegral(id) {
  var it = _intData[id];
  if (!it) return;
  var nuevoMes = document.getElementById('intRepetirMes').value;
  if (!nuevoMes) { showToast('⚠️ Elige la fecha para repetirlo'); return; }

  var nuevoChecklist = {};
  Object.keys(it.checklist || {}).forEach(function(k) {
    var ck = it.checklist[k];
    nuevoChecklist[k] = { desc: ck.desc, orden: ck.orden || 0, estado: 'pendiente', notas: '' };
  });
  var nuevosComponentes = JSON.parse(JSON.stringify(it.componentes || {}));
  var confirmaciones = {};
  (it.mecanicos || []).forEach(function(m) { confirmaciones[m.replace(/\s/g,'_')] = { nombre: m, confirmado: false }; });

  var nuevoId = 'INT-' + Date.now();
  var obj = {
    id: nuevoId, maqId: it.maqId, maqNombre: it.maqNombre,
    mesPrevisto: nuevoMes, estado: 'programada',
    descripcion: it.descripcion || '',
    componentes: nuevosComponentes, checklist: nuevoChecklist,
    mecanicos: (it.mecanicos || []).slice(), confirmaciones: confirmaciones,
    observaciones: '', createdAt: new Date().toISOString().substring(0,10), fechaCierre: '',
    repetidaDe: id
  };
  DB.ref('integrales/' + nuevoId).set(obj).then(function() {
    showToast('✅ Programada para ' + _intMesLabel(nuevoMes));
    abrirIntModal(nuevoId);
  }).catch(function() { showToast('❌ Error al repetir'); });
}
