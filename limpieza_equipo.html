*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

:root {

html, body { height: 100%; font-family: 'Nunito', sans-serif; }
body { background: var(--cream); color: var(--ink); min-height: 100vh; padding-bottom: 3rem; }

header {

.brand { font-family: 'Baloo 2', sans-serif; font-weight: 800; font-size: 1.2rem; color: #fff; }
.brand small { display: block; font-family: 'Nunito', sans-serif; font-weight: 700; font-size: 0.76rem; color: rgba(255,255,255,0.85); margin-top: 1px; }

main { max-width: 1400px; margin: 0 auto; padding: 1.8rem 1.5rem; position: relative; z-index: 1; }

/* ── EQUIPO (solo lectura) ── */
.equipo-strip { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 1.2rem; }

/* ── CONTROLS ── */

.ctrl-label { font-size: 0.72rem; text-transform: uppercase; letter-spacing: 0.03em; color: var(--ink-dim); font-weight: 800; }
.ctrl-select, .ctrl-input { background: #fdf6f0; border: 2px solid var(--line); color: var(--ink);

.ctrl-select:focus, .ctrl-input:focus { outline: none; border-color: var(--turq); }
.btn { font-family: 'Baloo 2', sans-serif; background: var(--coral-soft); border: 2px solid rgba(255,107,91,0.3); color: var(--coral-dark);

/* ── FICHA CARD ── */

let FESTIVOS = new Set([
  '2026-01-01','2026-01-06','2026-04-02','2026-04-03',

]);
function initFestivosListener() {
  DB.ref('turnos/festivos').on('value', snap => {
    const val = snap.val() || {};
    const oficiales = Object.keys(val).filter(f => val[f]?.oficial);
    if (oficiales.length) FESTIVOS = new Set(oficiales);
    render();
  });
}
function initAusenciasBanner() {
  DB.ref('config/limpieza_ausencias').on('value', snap => {
    const val = snap.val() || {};
    const hoy = new Date().toISOString().slice(0,10);
    const ausentesHoy = Object.values(val).filter(a => hoy >= a.desde && hoy <= a.hasta);
    const banner = document.getElementById('ausenciaBanner');
    if (!ausentesHoy.length) { banner.style.display = 'none'; return; }
    const nombres = ausentesHoy.map(a => escHtml(a.trabajador)).join(', ');
    banner.innerHTML = `🌴 Ausente${ausentesHoy.length>1?'s':''} hoy: <b>${nombres}</b>`;
    banner.style.display = 'block';
  });
}
function esDomingoOFestivo(mesISO, d) {
  const [y,m] = mesISO.split('-').map(Number);
  const ds = `${y}-${String(m).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
  if (new Date(ds+'T12:00:00').getDay() === 0) return true;
  return FESTIVOS.has(ds);
}

let _WORKERS = [];

function initWorkersListener() {
  DB.ref('config/limpieza_equipo').on('value', snap => {
    const val = snap.val() || {};
    _WORKERS = Object.values(val).sort((a,b) => (a.orden||0) - (b.orden||0));
    recalcularIniciales(_WORKERS);
    renderWorkers();
    render();
  });
}

let _initialsMap = {};

function candidatosIniciales(nombre) {
  const clean = nombre.replace(/\(.*?\)/g,'').trim();
  const parts = clean.split(/\s+/).filter(Boolean);
  const cands = [];
  if (parts.length >= 2) {
    cands.push(parts[0][0] + parts[1][0]);
    for (let i=1; i<parts[0].length; i++) cands.push(parts[0][0] + parts[0][i]);
  } else {
    const p = parts[0] || nombre;
    for (let i=1; i<p.length; i++) cands.push(p[0] + p[i]);
    cands.push(p.slice(0,2));
  }
  return cands.map(c => c.toUpperCase());
}

function recalcularIniciales(workers) {
  const used = new Set();
  const map = {};
  workers.forEach(w => {
    const cands = candidatosIniciales(w.nombre);
    const chosen = cands.find(c => !used.has(c)) || cands[0] || '??';
    used.add(chosen);
    map[w.nombre] = chosen;
  });
  _initialsMap = map;
}

function initials(nombre) {
  if (_initialsMap[nombre]) return _initialsMap[nombre];
  const parts = nombre.replace(/\(.*?\)/g,'').trim().split(/\s+/);
  if (parts.length === 1) return parts[0].slice(0,2).toUpperCase();
  return (parts[0][0] + parts[1][0]).toUpperCase();
}

function renderWorkers() {
  document.getElementById('equipoVacio').style.display = _WORKERS.length ? 'none' : 'block';
  document.getElementById('workerList').innerHTML = _WORKERS.map(w => `
    <span class="worker-chip">
      <span class="dot" style="background:${w.color}">${initials(w.nombre)}</span>
      ${escHtml(w.nombre)}
    </span>`).join('');
}

function escHtml(s){ return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
function escAttr(s){ return String(s).replace(/'/g,"\\'"); }

/* ══════════════════════════════════════════════════════════════════════
   MARCAS (Firebase: limpieza/checks/{parte}/{periodo}/{cellKey})
   ══════════════════════════════════════════════════════════════════════ */
let _CHECKS = {};
let _checksRef = null;

function periodoActual() {
  const parte = PARTES[document.getElementById('selParte').value];
  return parte.modo === 'meses' ? document.getElementById('selAnio').value : document.getElementById('selMes').value;
}

function attachChecksListener() {
  if (_checksRef) _checksRef.off();
  const parteKey = document.getElementById('selParte').value;
  const periodo = periodoActual();
  if (!periodo) return;
  _checksRef = DB.ref('config/limpieza_checks/'+parteKey+'/'+periodo);
  _checksRef.on('value', snap => { _CHECKS = snap.val() || {}; render(); });
}

/* ══════════════════════════════════════════════════════════════════════
   RENDER
   ══════════════════════════════════════════════════════════════════════ */
function poblarSelectorPartes() {
  const sel = document.getElementById('selParte');
  sel.innerHTML = Object.entries(PARTES).map(([k,p]) => `<option value="${k}">${p.titulo}</option>`).join('');
}

function cambiarParte() {
  const parte = PARTES[document.getElementById('selParte').value];
  document.getElementById('grpMes').style.display = parte.modo === 'meses' ? 'none' : '';
  document.getElementById('grpAnio').style.display = parte.modo === 'meses' ? '' : 'none';
  attachChecksListener();
}

function render() {
  const parteKey = document.getElementById('selParte').value;
  const parte = PARTES[parteKey];
  if (!parte) return;
  const checks = _CHECKS;
  const workerMap = {}; _WORKERS.forEach(w => workerMap[w.nombre] = w);
  const mesISO = document.getElementById('selMes').value;

  let html = `<div class="ficha-head">
      <div class="ficha-title">${escHtml(parte.titulo)}</div>
      <div class="ficha-code">FICHA DE LIMPIEZA – ${parte.codigo}</div>
    </div>`;
  if (parte.intro) html += `<div class="ficha-intro">${escHtml(parte.intro)}</div>`;

  parte.secciones.forEach((sec, secIdx) => {
    if (sec.titulo) html += `<div class="sec-title">${escHtml(sec.titulo)}</div>`;

    const metodoHeader = parte.sinMetodo ? null : (parte.metodoHeader || 'Método');
    html += `<div class="grid-wrap"><table class="grid"><thead><tr>
      <th style="text-align:left;min-width:180px">&nbsp;</th>`;
    if (metodoHeader) html += `<th style="text-align:left;min-width:110px">${metodoHeader}</th>`;

    if (parte.modo === 'dias') {
      for (let d=1; d<=31; d++) {
        const especial = esDomingoOFestivo(mesISO, d);
        html += `<th class="${especial?'col-especial':''}" title="${especial?'Domingo/festivo — normalmente no se trabaja':''}">${d}</th>`;
      }
    } else {
      for (let m=0; m<12; m++) html += `<th>${MESES_ABR[m]}</th>`;
    }
    html += `</tr></thead><tbody>`;

    sec.filas.forEach((fila, filaIdx) => {
      const [label, metodo] = fila;
      html += `<tr><td class="lbl">${escHtml(label)}</td>`;
      if (metodoHeader) html += `<td class="met">${escHtml(metodo||'')}</td>`;
      const nCols = parte.modo === 'dias' ? 31 : 12;
      for (let i=0; i<nCols; i++) {
        const cellKey = `${secIdx}_${filaIdx}_${i}`;
        const mark = checks[cellKey];
        const especial = parte.modo === 'dias' && esDomingoOFestivo(mesISO, i+1);
        const cellClass = `cell${especial?' col-especial':''}`;
        if (mark && workerMap[mark.trabajador]) {
          const w = workerMap[mark.trabajador];
          html += `<td class="${cellClass}"><div class="chk done" style="background:${w.color}"
            title="${escAttr(mark.trabajador)}"
            onclick="abrirPopover(event,'${parteKey}','${cellKey}')">${initials(mark.trabajador)}</div></td>`;
        } else if (mark) {
          html += `<td class="${cellClass}"><div class="chk done" style="background:#555"
            title="${escAttr(mark.trabajador)} (ya no está en el equipo)"
            onclick="abrirPopover(event,'${parteKey}','${cellKey}')">?</div></td>`;
        } else {
          html += `<td class="${cellClass}"><div class="chk" onclick="abrirPopover(event,'${parteKey}','${cellKey}')"></div></td>`;
        }
      }
      html += `</tr>`;
    });
    html += `</tbody></table></div>`;
    if (sec.nota) html += `<div class="foot-note">${escHtml(sec.nota)}</div>`;
  });

  if (parte.nota) html += `<div class="nota-final">NOTA: ${escHtml(parte.nota)}</div>`;

  document.getElementById('fichaCard').innerHTML = html;
}

/* ══════════════════════════════════════════════════════════════════════
   POPOVER: elegir quién ha hecho la tarea
   ══════════════════════════════════════════════════════════════════════ */
let _popCtx = null;

function abrirPopover(ev, parteKey, cellKey) {
  ev.stopPropagation();
  if (!_WORKERS.length) { return; }
  _popCtx = { parteKey, cellKey };
  const actual = _CHECKS[cellKey];

  const pop = document.getElementById('popover');
  let html = `<div class="popover-title">${actual ? 'Cambiar a…' : '¿Quién lo ha hecho?'}</div>`;
  html += _WORKERS.map(w => `
    <div class="popover-worker" onclick="marcar('${escAttr(w.nombre)}')">
      <span class="popover-dot" style="background:${w.color}">${initials(w.nombre)}</span>
      ${escHtml(w.nombre)}
    </div>`).join('');
  if (actual) {
    html += `<div class="popover-actions"><div class="popover-unmark" onclick="desmarcar()">✕ Desmarcar</div></div>`;
  }
  pop.innerHTML = html;

  const rect = ev.currentTarget.getBoundingClientRect();
  pop.style.left = Math.min(rect.left, window.innerWidth - 230) + 'px';
  pop.style.top = (rect.bottom + 6) + 'px';
  pop.classList.add('open');
  document.getElementById('overlay').classList.add('open');
}

function cerrarPopover() {
  document.getElementById('popover').classList.remove('open');
  document.getElementById('overlay').classList.remove('open');
  _popCtx = null;
}

function marcar(trabajador) {
  if (!_popCtx) return;
  const { parteKey, cellKey } = _popCtx;
  DB.ref('config/limpieza_checks/'+parteKey+'/'+periodoActual()+'/'+cellKey).set({ trabajador, ts: Date.now() });
  cerrarPopover();
}

function desmarcar() {
  if (!_popCtx) return;
  const { parteKey, cellKey } = _popCtx;
  DB.ref('config/limpieza_checks/'+parteKey+'/'+periodoActual()+'/'+cellKey).remove();
  cerrarPopover();
}

        return `${MESES_LARGO[m-1]} de ${y}`;

  const resumen = {};

    }

      for (let d=1; d<=31; d++) {

      }

      for (let m=0; m<12; m++) filasHtml += `<th>${MESES_ABR[m]}</th>`;
    }
    filasHtml += `</tr>`;

    sec.filas.forEach((fila, filaIdx) => {
      const [label, metodo] = fila;
      filasHtml += `<tr><td class="td-lbl">${escHtml(label)}</td>`;
      if (metodoHeader) filasHtml += `<td class="td-met">${escHtml((metodo||'').replace(/\n/g,' — '))}</td>`;
      for (let i=0; i<nCols; i++) {
        const cellKey = `${secIdx}_${filaIdx}_${i}`;
        const mark = checks[cellKey];
        const esp = parte.modo === 'dias' && esDomingoOFestivo(mesISO, i+1);
        totalCasillas++;
        if (mark) {
          totalMarcadas++;
          if (resumen[mark.trabajador] !== undefined) resumen[mark.trabajador]++;
          const w = workerMap[mark.trabajador];
          const color = w ? w.color : '#999';
          filasHtml += `<td class="td-cell${esp?' col-esp':''}"><span class="badge" style="background:${color}" title="${escAttr(mark.trabajador)}">${initials(mark.trabajador)}</span></td>`;
        } else {
          filasHtml += `<td class="td-cell${esp?' col-esp':''}"></td>`;
        }
      }
      filasHtml += `</tr>`;
    });
    if (sec.nota) filasHtml += `<tr><td colspan="${(metodoHeader?2:1) + nCols}" class="foot-row">${escHtml(sec.nota)}</td></tr>`;
  });

  const equipoHtml = _WORKERS.map(w => `
    <div class="eq-chip">
      <span class="eq-dot" style="background:${w.color}">${initials(w.nombre)}</span>
      <span class="eq-name">${escHtml(w.nombre)}</span>
      <span class="eq-count">${resumen[w.nombre]}</span>
    </div>`).join('');

  const pctCumpl = totalCasillas ? Math.round(totalMarcadas/totalCasillas*100) : 0;
  const fechaGen = new Date().toLocaleDateString('es-ES', {day:'2-digit',month:'2-digit',year:'numeric'}) + ' ' +
    new Date().toLocaleTimeString('es-ES', {hour:'2-digit',minute:'2-digit'});

  w.document.write(`<!DOCTYPE html><html><head><meta charset="UTF-8">
