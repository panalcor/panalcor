<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>PANALCOR — Alberto</title>
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;600;700&family=Barlow:wght@300;400;500;700;900&display=swap" rel="stylesheet">
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --navy:#0d1b2a;--navy2:#1a2d42;--gold:#c9a227;--gold2:#f0c040;
  --green:#2ecc71;--red:#e74c3c;--blue:#3498db;--grey:rgba(255,255,255,0.35);
  --cat-font:rgba(39,174,96,0.8);--cat-aire:rgba(52,152,219,0.8);
  --cat-sold:rgba(231,76,60,0.8);--cat-estr:rgba(243,156,18,0.8);
  --cat-band:rgba(155,89,182,0.8);--cat-mec:rgba(26,188,156,0.8);--cat-otro:rgba(127,140,141,0.8);
}
html{min-height:100%;font-family:'Barlow',sans-serif;background:var(--navy)}
body{min-height:100vh;color:#fff;padding-bottom:40px}

/* ── LOGIN ── */
#loginWrap{display:flex;align-items:center;justify-content:center;min-height:100vh;padding:20px}
.login-box{background:var(--navy2);border:1px solid rgba(201,162,39,0.3);border-radius:16px;padding:32px 28px;max-width:340px;width:100%;text-align:center}
.login-box h1{font-family:'Oswald',sans-serif;font-size:1.6rem;color:var(--gold2);letter-spacing:.1em;margin-bottom:4px}
.login-box .sub{font-size:.78rem;color:var(--grey);letter-spacing:.12em;margin-bottom:24px}
.inp{width:100%;background:rgba(255,255,255,0.06);border:1px solid rgba(255,255,255,0.15);border-radius:8px;padding:11px 14px;color:#fff;font-family:'Barlow',sans-serif;font-size:.95rem;margin-bottom:12px;outline:none}
.inp:focus{border-color:var(--gold)}
.btn-login{width:100%;padding:13px;background:linear-gradient(135deg,rgba(201,162,39,0.25),rgba(201,162,39,0.1));border:2px solid rgba(201,162,39,0.5);color:var(--gold2);border-radius:10px;cursor:pointer;font-family:'Barlow',sans-serif;font-size:1rem;font-weight:900;letter-spacing:.1em;margin-top:4px}
.err{color:var(--red);font-size:.82rem;margin-top:8px;min-height:18px}

/* ── APP ── */
#appWrap{display:none;max-width:600px;margin:0 auto;padding:16px 12px}
.top-bar{display:flex;align-items:center;justify-content:space-between;margin-bottom:20px;padding-bottom:14px;border-bottom:1px solid rgba(255,255,255,0.08)}
.top-bar h2{font-family:'Oswald',sans-serif;font-size:1.4rem;color:var(--gold2);letter-spacing:.08em}
.btn-logout{background:transparent;border:1px solid rgba(255,255,255,0.12);color:var(--grey);padding:6px 14px;border-radius:7px;cursor:pointer;font-family:'Barlow',sans-serif;font-size:.78rem}

/* ── FORMULARIO ── */
.card{background:var(--navy2);border:1px solid rgba(255,255,255,0.08);border-radius:14px;padding:18px;margin-bottom:16px}
.card-title{font-size:.7rem;font-weight:700;letter-spacing:.15em;color:var(--gold);text-transform:uppercase;margin-bottom:14px}
.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:10px}
label.lbl{font-size:.72rem;font-weight:700;color:var(--grey);letter-spacing:.1em;display:block;margin-bottom:4px}
select.inp,input.inp,textarea.inp{margin-bottom:0}
select.inp{background:#0d1b2a;color:#fff;-webkit-appearance:none;appearance:none}
textarea.inp{resize:none;line-height:1.45}
.btn-add{width:100%;padding:13px;background:linear-gradient(135deg,rgba(39,174,96,0.25),rgba(39,174,96,0.1));border:2px solid rgba(39,174,96,0.5);color:var(--green);border-radius:10px;cursor:pointer;font-family:'Barlow',sans-serif;font-size:.95rem;font-weight:900;margin-top:10px}

/* ── HISTORIAL ── */
.mes-nav{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}
.mes-nav span{font-size:.95rem;font-weight:700;color:var(--gold2)}
.mes-nav button{background:rgba(255,255,255,0.07);border:1px solid rgba(255,255,255,0.12);color:#fff;width:32px;height:32px;border-radius:8px;cursor:pointer;font-size:1.1rem}
.kpi-row{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}
.kpi{background:rgba(255,255,255,0.04);border:1px solid rgba(255,255,255,0.07);border-radius:10px;padding:10px 14px;flex:1;min-width:80px;text-align:center}
.kpi-num{font-family:'Oswald',sans-serif;font-size:1.5rem;font-weight:700;color:var(--gold2)}
.kpi-lbl{font-size:.65rem;letter-spacing:.1em;color:var(--grey);margin-top:2px}
.entry{display:flex;gap:10px;align-items:flex-start;padding:10px 12px;background:rgba(255,255,255,0.03);border:1px solid rgba(255,255,255,0.06);border-radius:10px;margin-bottom:8px}
.entry-cat{font-size:.68rem;font-weight:700;padding:3px 8px;border-radius:20px;white-space:nowrap;flex-shrink:0;margin-top:2px;text-transform:uppercase;letter-spacing:.06em}
.entry-body{flex:1;min-width:0}
.entry-fecha{font-size:.72rem;color:var(--grey);margin-bottom:2px}
.entry-desc{font-size:.88rem;line-height:1.4;word-break:break-word}
.entry-horas{font-size:.75rem;color:var(--gold);margin-top:3px}
.btn-del{background:transparent;border:none;color:rgba(255,255,255,0.2);cursor:pointer;font-size:1rem;flex-shrink:0;padding:4px;line-height:1;transition:color .15s}
.btn-del:hover{color:var(--red)}
.no-data{text-align:center;color:var(--grey);font-size:.85rem;padding:24px 0}

/* ── CATEGORÍA COLORES ── */
.c-font{background:rgba(39,174,96,0.15);color:#82e0aa;border:1px solid rgba(39,174,96,0.3)}
.c-aire{background:rgba(52,152,219,0.15);color:#74b9ff;border:1px solid rgba(52,152,219,0.3)}
.c-sold{background:rgba(231,76,60,0.15);color:#ff8a80;border:1px solid rgba(231,76,60,0.3)}
.c-estr{background:rgba(243,156,18,0.15);color:#f0c040;border:1px solid rgba(243,156,18,0.3)}
.c-band{background:rgba(155,89,182,0.15);color:#c39bd3;border:1px solid rgba(155,89,182,0.3)}
.c-mec{background:rgba(26,188,156,0.15);color:#76d7c4;border:1px solid rgba(26,188,156,0.3)}
.c-otro{background:rgba(127,140,141,0.15);color:#bdc3c7;border:1px solid rgba(127,140,141,0.3)}
</style>
</head>
<body>

<!-- LOGIN -->
<div id="loginWrap">
  <div class="login-box">
    <h1>👷 ALBERTO</h1>
    <div class="sub">PANALCOR S.L. — Registro de trabajos</div>
    <input id="lpwd" class="inp" type="password" placeholder="Contraseña" autocomplete="current-password" onkeydown="if(event.key==='Enter')doLogin()">
    <button class="btn-login" onclick="doLogin()">ENTRAR</button>
    <div class="err" id="lerr"></div>
  </div>
</div>

<!-- APP -->
<div id="appWrap">
  <div class="top-bar">
    <h2>👷 ALBERTO</h2>
    <button class="btn-logout" onclick="doLogout()">↩ Salir</button>
  </div>

  <!-- Formulario nuevo trabajo -->
  <div class="card">
    <div class="card-title">➕ Registrar trabajo</div>
    <div class="form-grid">
      <div>
        <label class="lbl">Fecha</label>
        <input type="date" id="fFecha" class="inp">
      </div>
      <div>
        <label class="lbl">Horas</label>
        <input type="number" id="fHoras" class="inp" min="0.5" max="16" step="0.5" placeholder="2">
      </div>
    </div>
    <div style="margin-bottom:10px">
      <label class="lbl">Categoría</label>
      <select id="fCat" class="inp">
        <option value="fontaneria">🔧 Fontanería</option>
        <option value="aire">❄️ Aire / Climatización</option>
        <option value="soldadura">🔥 Soldadura</option>
        <option value="estructuras">🏗️ Estructuras</option>
        <option value="bandejas">🍽️ Bandejas / Carros</option>
        <option value="mecanicos">🛠️ Apoyo Mecánicos</option>
        <option value="otros">📋 Otros</option>
      </select>
    </div>
    <div>
      <label class="lbl">Descripción</label>
      <textarea id="fDesc" class="inp" rows="3" placeholder="Describe brevemente el trabajo realizado..."></textarea>
    </div>
    <button class="btn-add" onclick="guardarTrabajo()">✅ GUARDAR TRABAJO</button>
  </div>

  <!-- Historial -->
  <div class="card">
    <div class="card-title">📋 Trabajos del mes</div>
    <div class="mes-nav">
      <button onclick="navMes(-1)">◀</button>
      <span id="mesLabel"></span>
      <button onclick="navMes(1)">▶</button>
    </div>
    <div class="kpi-row" id="kpiRow"></div>
    <div id="listaTrabajos"></div>
  </div>
</div>

<script>
var FB_CFG = {
  apiKey:"AIzaSyC_AJEkrbWqfE65Mt_f5V0LfemPJc10UuU",
  authDomain:"panalcor-mantenimiento.firebaseapp.com",
  databaseURL:"https://panalcor-mantenimiento-default-rtdb.europe-west1.firebasedatabase.app",
  projectId:"panalcor-mantenimiento",
  storageBucket:"panalcor-mantenimiento.firebasestorage.app",
  messagingSenderId:"67593058609",
  appId:"1:67593058609:web:c33fa1fa4fce2932485810"
};
firebase.initializeApp(FB_CFG);
var DB = firebase.database();

var SES_KEY = 'alberto_sesion';
var mesActual = '';
var trabajosData = {};

var CAT_LABELS = {
  fontaneria:'Fontanería', aire:'Aire / Clima', soldadura:'Soldadura',
  estructuras:'Estructuras', bandejas:'Bandejas/Carros', mecanicos:'Apoyo Mecánicos', otros:'Otros'
};
var CAT_CSS = {
  fontaneria:'c-font', aire:'c-aire', soldadura:'c-sold',
  estructuras:'c-estr', bandejas:'c-band', mecanicos:'c-mec', otros:'c-otro'
};
var CAT_ICONS = {
  fontaneria:'🔧', aire:'❄️', soldadura:'🔥', estructuras:'🏗️',
  bandejas:'🍽️', mecanicos:'🛠️', otros:'📋'
};

function hoy(){ return new Date().toISOString().slice(0,10); }
function pad(n){ return String(n).padStart(2,'0'); }
function mesHoy(){
  var d = new Date(); return d.getFullYear()+'-'+pad(d.getMonth()+1);
}
function labelMes(mes){
  var meses=['Enero','Febrero','Marzo','Abril','Mayo','Junio','Julio','Agosto','Septiembre','Octubre','Noviembre','Diciembre'];
  var p=mes.split('-'); return meses[parseInt(p[1],10)-1]+' '+p[0];
}

// ── SESSION ──
function getSesion(){
  try{
    var s=JSON.parse(localStorage.getItem(SES_KEY)||'null');
    if(s && Date.now()<s.exp) return s;
  }catch(e){}
  return null;
}

// ── LOGIN ──
function doLogin(){
  var pwd = document.getElementById('lpwd').value;
  var err = document.getElementById('lerr');
  err.textContent = '';
  if(!pwd){ err.textContent='Introduce la contraseña'; return; }
  DB.ref('config/mecanicos_pwd/ALBERTO').once('value').then(function(snap){
    if(snap.val() && snap.val()===pwd){
      localStorage.setItem(SES_KEY, JSON.stringify({exp:Date.now()+30*24*3600*1000}));
      abrirApp();
    } else {
      err.textContent = 'Contraseña incorrecta';
    }
  }).catch(function(){ err.textContent='Error de conexión'; });
}

function doLogout(){
  localStorage.removeItem(SES_KEY);
  window.location.reload();
}

// ── APP ──
function abrirApp(){
  document.getElementById('loginWrap').style.display='none';
  document.getElementById('appWrap').style.display='block';
  mesActual = mesHoy();
  document.getElementById('fFecha').value = hoy();
  cargarMes();
}

function navMes(dir){
  var p=mesActual.split('-'); var y=parseInt(p[0],10), m=parseInt(p[1],10)+dir;
  if(m<1){m=12;y--;} if(m>12){m=1;y++;}
  mesActual=y+'-'+pad(m); cargarMes();
}

function cargarMes(){
  document.getElementById('mesLabel').textContent = labelMes(mesActual);
  DB.ref('alberto_trabajos/'+mesActual).once('value').then(function(snap){
    trabajosData = snap.val() || {};
    renderLista();
  });
}

function renderLista(){
  var entries = Object.entries(trabajosData).sort(function(a,b){ return b[1].ts-a[1].ts; });
  var totalHoras = 0;
  var catCount = {};
  entries.forEach(function(e){
    var t=e[1];
    totalHoras += parseFloat(t.horas)||0;
    catCount[t.cat] = (catCount[t.cat]||0)+1;
  });

  // KPIs
  var kpiHtml = '<div class="kpi"><div class="kpi-num">'+entries.length+'</div><div class="kpi-lbl">Trabajos</div></div>'
    + '<div class="kpi"><div class="kpi-num">'+totalHoras.toFixed(1)+'h</div><div class="kpi-lbl">Horas</div></div>';
  // top categoría
  var topCat = Object.entries(catCount).sort(function(a,b){return b[1]-a[1];})[0];
  if(topCat) kpiHtml += '<div class="kpi"><div class="kpi-num" style="font-size:1rem;padding-top:4px">'+(CAT_ICONS[topCat[0]]||'')+'</div><div class="kpi-lbl">'+(CAT_LABELS[topCat[0]]||topCat[0])+'</div></div>';
  document.getElementById('kpiRow').innerHTML = kpiHtml;

  if(!entries.length){
    document.getElementById('listaTrabajos').innerHTML='<div class="no-data">Sin trabajos registrados este mes</div>';
    return;
  }
  var html='';
  entries.forEach(function(e){
    var key=e[0], t=e[1];
    var css=CAT_CSS[t.cat]||'c-otro';
    var lbl=CAT_LABELS[t.cat]||t.cat;
    var ico=CAT_ICONS[t.cat]||'📋';
    html+='<div class="entry">'
      +'<span class="entry-cat '+css+'">'+ico+' '+lbl+'</span>'
      +'<div class="entry-body">'
        +'<div class="entry-fecha">'+t.fecha+'</div>'
        +'<div class="entry-desc">'+escHtml(t.desc)+'</div>'
        +(t.horas ? '<div class="entry-horas">⏱ '+t.horas+' h</div>' : '')
      +'</div>'
      +'<button class="btn-del" onclick="borrarTrabajo(\''+key+'\')">✕</button>'
    +'</div>';
  });
  document.getElementById('listaTrabajos').innerHTML = html;
}

function guardarTrabajo(){
  var fecha = document.getElementById('fFecha').value || hoy();
  var cat   = document.getElementById('fCat').value;
  var desc  = (document.getElementById('fDesc').value||'').trim();
  var horas = parseFloat(document.getElementById('fHoras').value)||0;
  if(!desc){ toast('⚠️ Escribe una descripción',true); return; }
  var key = fecha.replace(/-/g,'')+'_'+Date.now();
  var data = {fecha:fecha, cat:cat, desc:desc, horas:horas||null, ts:Date.now()};
  DB.ref('alberto_trabajos/'+fecha.slice(0,7)+'/'+key).set(data)
    .then(function(){
      toast('✅ Trabajo guardado');
      document.getElementById('fDesc').value='';
      document.getElementById('fHoras').value='';
      if(fecha.slice(0,7)===mesActual){
        trabajosData[key]=data; renderLista();
      }
    }).catch(function(e){ toast('❌ Error: '+e.message,true); });
}

function borrarTrabajo(key){
  if(!confirm('¿Eliminar este registro?')) return;
  var t=trabajosData[key];
  var mes=t?t.fecha.slice(0,7):mesActual;
  DB.ref('alberto_trabajos/'+mes+'/'+key).remove().then(function(){
    delete trabajosData[key]; renderLista(); toast('🗑 Eliminado');
  });
}

function escHtml(s){ return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

function toast(msg, err){
  var el=document.createElement('div');
  el.style.cssText='position:fixed;bottom:24px;left:50%;transform:translateX(-50%);'
    +'background:'+(err?'#c0392b':'#1a7a45')+';color:#fff;padding:10px 22px;border-radius:10px;'
    +'font-family:Barlow,sans-serif;font-size:.9rem;font-weight:700;z-index:9999;'
    +'box-shadow:0 4px 20px rgba(0,0,0,0.5);pointer-events:none';
  el.textContent=msg; document.body.appendChild(el);
  setTimeout(function(){el.remove();},2500);
}

// ── ARRANQUE ──
(function(){
  try {
    var adm=JSON.parse(localStorage.getItem('panalcor_session')||'null');
    if(adm && adm.rol==='admin' && Date.now()<adm.expires){ abrirApp(); return; }
  } catch(e){}
  if(getSesion()) abrirApp();
})();
</script>
</body>
</html>
